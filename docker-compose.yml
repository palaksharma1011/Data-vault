services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vault}
      POSTGRES_USER: ${POSTGRES_USER:-vault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    # No "ports:" on purpose: the DB is only reachable by the vault
    # container over the internal network, not from your host or LAN.
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  vault:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - vault-data:/app/data          # encrypted file blobs
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vault}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vault}?sslmode=disable
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:?set VAULT_MASTER_KEY in .env}
      VAULT_ADMIN_PASSWORD: ${VAULT_ADMIN_PASSWORD:?set VAULT_ADMIN_PASSWORD in .env}
      VAULT_REQUIRE_MFA: ${VAULT_REQUIRE_MFA:-false}
      VAULT_HIDE_UNAUTHORIZED: ${VAULT_HIDE_UNAUTHORIZED:-false}
      VAULT_MAX_UPLOAD_MB: ${VAULT_MAX_UPLOAD_MB:-200}
    networks: [backend]
    # Hardening
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  backend:

volumes:
  vault-data:
  pg-data: