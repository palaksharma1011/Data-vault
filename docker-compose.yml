services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vault
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: vault_password   # change for anything real
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault -d vault"]
      interval: 3s
      timeout: 3s
      retries: 20

  vault:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - vault-data:/app/data   # encrypted file blobs + master key
    environment:
      DATABASE_URL: postgres://vault:vault_password@postgres:5432/vault?sslmode=disable
      # Optional hardening / settings (see README):
      # VAULT_REQUIRE_MFA: "true"          # force every user to enrol MFA
      # VAULT_HIDE_UNAUTHORIZED: "true"    # hide files a role has no policy for
      # VAULT_ADMIN_PASSWORD: "change-me-12345"   # first-run admin password
      # VAULT_MAX_UPLOAD_MB: "200"
      # VAULT_MASTER_KEY: ""               # base64 32-byte key (use a secret manager)

volumes:
  vault-data:
  pg-data:
